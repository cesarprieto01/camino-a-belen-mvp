    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div class="tb-f" style="display: flex; flex-direction: column; gap: 6px">

        <div style="position: relative">

          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF6DD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 14px; top: 17px; pointer-events: none"><path d="M6 9l6 6 6-6"></path></svg>
        </div>
        <p class="tb-error" id="tb-ciudad-error" role="alert" hidden></p>
      </div>
    </div>
    <div class="tb-f" style="display: flex; flex-direction: column; gap: 6px">

    <div class="tb-f" style="display: flex; flex-direction: column; gap: 6px">

    </div>
    <div class="tb-f" style="display: flex; flex-direction: column; gap: 6px">
      <label class="tb-etiqueta" for="tb-cp">Código postal <span class="tb-opcional">(opcional)</span></label>
      <input class="tb-campo" id="tb-cp" type="text" inputmode="numeric" autocomplete="postal-code" style="max-width: 180px">
    </div>
    <div class="tb-f" style="display: flex; flex-direction: column; gap: 6px">
      <label class="tb-etiqueta" for="tb-notas">Indicaciones para la entrega <span class="tb-opcional">(opcional)</span></label>
      <textarea class="tb-campo" id="tb-notas" placeholder="Ej.: dejarla en portería"></textarea>
    </div>
    <div class="tb-f" style="display: flex; flex-direction: column; gap: 6px">
      <label class="tb-acepto">
