<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Camino a Belén · Galería</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap">
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#F1F9FC;--ink:#0B748A;--muted:#5F5F5F;--card:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#00082B;--ink:#FFFFFF;--muted:#FFF6DD;--card:#274E7C}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Mulish,system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1400px;margin:auto}
h1{font-family:"Neue Montreal",Mulish,sans-serif;margin:0;font-size:28px}
p{margin:6px 0 0;color:var(--muted)}
.sec{max-width:1400px;margin:auto;padding:12px 16px}
.sec h2{font-family:"Neue Montreal",Mulish,sans-serif;font-size:18px;margin:18px 0 10px;text-wrap:balance}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.it{flex:none;width:195px;cursor:pointer;background:none;border:0;padding:0;color:inherit;text-align:left;font:inherit}
.thumb{width:195px;height:422px;overflow:hidden;border-radius:18px;background:var(--card);position:relative}
.thumb>div{transform:scale(.5);transform-origin:0 0;position:absolute;left:0;top:0;pointer-events:none}
.it span{display:block;font-size:12px;margin-top:6px;color:var(--muted)}
#view{position:fixed;inset:0;background:rgba(0,8,43,.8);display:none;align-items:center;justify-content:center;z-index:9}
#view.on{display:flex}
#frame{width:390px;height:844px;overflow:auto;border-radius:36px;background:#000;position:relative}
#frame>div{position:relative}
</style>
</head>
<body>
<header><h1>Camino a Belén · todas las pantallas</h1><p>Vista previa mientras se arma el MVP navegable. Toca una pantalla para verla en grande.</p></header>
<main id="m"></main>
<div id="view"><div id="frame"></div></div>
<script>
const SECTIONS=[[3380,'1 · Antes del 29 de noviembre'],[5888,'2 · Un día normal'],[8908,'3 · Día de ruleta'],[12598,'4 · Juegos sorpresa'],[15346,'5 · La energía de Teodoro'],[18126,'6 · Dónde vive el Adviento'],[22120,'7 · Durante el camino'],[28415,'8 · Nochebuena'],[30923,'9 · Piezas'],[33579,'10 · Dirección de arte'],[0,'0 · Empieza aquí']];
fetch('screens/manifest.json').then(r=>r.json()).then(async man=>{
  const groups={};
  for(const [id,s] of Object.entries(man)){
    const sec=SECTIONS.filter(x=>x[0]<=s.y).sort((a,b)=>b[0]-a[0])[0][1];
    (groups[sec]??=[]).push([id,s]);
  }
  const m=document.getElementById('m');
  for(const [,name] of [...SECTIONS].sort((a,b)=>a[0]-b[0])){
    const items=(groups[name]||[]).sort((a,b)=>a[1].y-b[1].y||a[1].x-b[1].x);
    const sec=document.createElement('section');sec.className='sec';
    sec.innerHTML=`<h2>${name}</h2><div class="row"></div>`;m.appendChild(sec);
    const row=sec.querySelector('.row');
    for(const [id,s] of items){
      const b=document.createElement('button');b.className='it';
      b.innerHTML=`<div class="thumb"><div></div></div><span>${s.title}</span>`;
      row.appendChild(b);
      fetch('screens/'+id+'.html').then(r=>r.text()).then(h=>b.querySelector('.thumb>div').innerHTML=h);
      b.onclick=async()=>{document.getElementById('frame').innerHTML='<div>'+await (await fetch('screens/'+id+'.html')).text()+'</div>';document.getElementById('view').classList.add('on')};
    }
  }
});
document.getElementById('view').onclick=e=>{if(e.target.id==='view')e.currentTarget.classList.remove('on')};
</script>
</body>
</html>
